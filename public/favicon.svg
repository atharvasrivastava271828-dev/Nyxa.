<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Subtle Golden Halo Gradient -->
    <radialGradient id="goldenHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDF00" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Dark Rounded Background -->
  <rect width="32" height="32" rx="7" fill="#0A0A0A" />
  
  <!-- Halo Effect behind the logo -->
  <circle cx="16" cy="16" r="12" fill="url(#goldenHalo)" />
  
  <!-- The Nyxa 'N' Logo -->
  <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">N</text>
</svg>
